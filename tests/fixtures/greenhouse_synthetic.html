<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greenhouse Job Application Form</title>
</head>
<body>
  <div id="application">
    <form id="application_form" action="/apply" method="post" enctype="multipart/form-data">
      <div class="field">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="job_application[first_name]" autocomplete="given-name" required />
      </div>
      <div class="field">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="job_application[last_name]" autocomplete="family-name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="job_application[email]" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="job_application[phone]" autocomplete="tel" />
      </div>
      <div class="field">
        <label for="job_application_location">Location</label>
        <input type="text" id="job_application_location" name="job_application[location]" />
      </div>
      <div class="field">
        <label for="job_application_answers_attributes_0_text_value">LinkedIn Profile</label>
        <input type="text" id="job_application_answers_attributes_0_text_value" name="job_application[answers_attributes][0][text_value]" />
      </div>
      <div class="field">
        <label for="job_application_answers_attributes_1_text_value">Website / GitHub</label>
        <input type="text" id="job_application_answers_attributes_1_text_value" name="job_application[website]" />
      </div>
      <div class="field">
        <label for="resume">Resume / CV</label>
        <input type="file" id="resume" name="job_application[resume]" accept=".pdf,.doc,.docx" />
      </div>
      <div class="actions">
        <button type="submit" id="submit_app">Submit Application</button>
      </div>
    </form>
  </div>
</body>
</html>
